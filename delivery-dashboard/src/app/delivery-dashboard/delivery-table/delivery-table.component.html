<table mat-table  [dataSource]="dataSource" >
    <!-- Order ID Column -->
    <ng-container matColumnDef="orderId">
        <th mat-header-cell *matHeaderCellDef> Order ID </th>
        <td mat-cell *matCellDef="let element"> {{element.orderId}} </td>
    </ng-container>

    <!-- Agent Name Column -->
    <ng-container matColumnDef="agentName">
        <th mat-header-cell *matHeaderCellDef> Agent Name </th>
        <td mat-cell *matCellDef="let element"> {{element.agentName}} </td>
    </ng-container>

    <!-- From Column -->
    <ng-container matColumnDef="from">
        <th mat-header-cell *matHeaderCellDef> From </th>
        <td mat-cell *matCellDef="let element"> {{element.from}} </td>
    </ng-container>

    <!-- To Column -->
    <ng-container matColumnDef="to">
        <th mat-header-cell *matHeaderCellDef> To </th>
        <td mat-cell *matCellDef="let element"> {{element.to}} </td>
    </ng-container>

    <!-- Estimated Date Column -->
    <ng-container matColumnDef="estimatedDate">
        <th mat-header-cell *matHeaderCellDef> Estimated Date </th>
        <td mat-cell *matCellDef="let element"> {{element.estimatedDate}} </td>
    </ng-container>

    <!-- Delivered Date Column -->
    <ng-container matColumnDef="deliveredDate">
        <th mat-header-cell *matHeaderCellDef> Delivered Date </th>
        <td mat-cell *matCellDef="let element"> {{element.deliveredDate || 'N/A'}} </td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let element"> {{element.status}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator #paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons
    aria-label="Select page of periodic elements">
</mat-paginator>
